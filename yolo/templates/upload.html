<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传影像</title>
    <link rel="stylesheet" href="/static/css/upload.css">
</head>
<body class="{{ setting.theme }} {{ setting.font_size }}">
    <div class="decorative-circle decorative-circle-1"></div>
    <div class="decorative-circle decorative-circle-2"></div>
    <div class="decorative-circle decorative-circle-3"></div>
    <div class="decorative-square decorative-square-1"></div>
    <div class="decorative-square decorative-square-2"></div>
    
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="window.history.back()" title="返回上一页">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h1>上传影像</h1>
        </div>
        
        <div class="upload-tabs">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="image">图片</button>
                <button class="tab-button" data-tab="video">视频</button>
                <button class="tab-button" data-tab="folder">文件夹</button>
            </div>
            
            <div class="tab-content">
                <div class="tab-pane active" id="image-tab">
                    <form id="imageForm" method="POST" enctype="multipart/form-data" action="/upload">
                        <div class="form-group">
                            <label for="imageFile">选择图片</label>
                            <input type="file" id="imageFile" name="file" accept="image/*" required>
                            <p class="hint">支持的格式: JPG, PNG</p>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="upload-button">上传并检测</button>
                        </div>
                    </form>
                </div>
                
                <div class="tab-pane" id="video-tab">
                    <form id="videoForm" method="POST" enctype="multipart/form-data" action="/upload">
                        <div class="form-group">
                            <label for="videoFile">选择视频</label>
                            <input type="file" id="videoFile" name="file" accept="video/*,.gif" required>
                            <p class="hint">支持的格式: MP4, AVI, MOV, GIF</p>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="upload-button">上传并检测</button>
                        </div>
                    </form>
                </div>
                
                <div class="tab-pane" id="folder-tab">
                    <form id="folderForm" method="POST" enctype="multipart/form-data" action="/upload/folder">
                        <div class="form-group">
                            <label for="folderFile">选择文件夹</label>
                            <input type="file" id="folderFile" name="files" webkitdirectory directory multiple required>
                            <p class="hint">选择包含图片的文件夹</p>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="upload-button">上传并检测</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>正在处理，请稍候...</p>
        </div>
        
        <div id="resultContainer" class="result-container hidden">
            <h2>检测结果</h2>
            
            <div class="result-content">
                <div class="file-info">
                    <h3>文件信息</h3>
                    <p><span class="label">文件名:</span> <span id="fileName"></span></p>
                    <p><span class="label">文件类型:</span> <span id="fileType"></span></p>
                    <p><span class="label">文件大小:</span> <span id="fileSize"></span></p>
                </div>
                
                <div class="detection-result">
                    <h3>检测结果</h3>
                    <div id="resultContent"></div>
                </div>
                

            </div>
        </div>
    </div>
    
    <script src="/static/js/upload.js"></script>
</body>
</html>
