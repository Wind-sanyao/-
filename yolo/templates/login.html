<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 火眼金睛</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="decorative-circle decorative-circle-1"></div>
        <div class="decorative-circle decorative-circle-2"></div>
        <div class="decorative-circle decorative-circle-3"></div>
        <div class="decorative-circle decorative-circle-4"></div>
        <div class="decorative-square decorative-square-1"></div>
        <div class="decorative-square decorative-square-2"></div>
        <div class="decorative-square decorative-square-3"></div>
        
        <div class="login-form">
            <h1 class="title">火眼金睛</h1>
            <h2 class="subtitle">智能摄像头监控系统</h2>
            
            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="phone">用户名或手机号</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="login-button">登录</button>
                    <a href="/register" class="register-link">注册新账户</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
