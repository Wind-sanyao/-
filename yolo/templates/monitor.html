<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时监控</title>
    <link rel="stylesheet" href="/static/css/monitor.css">
</head>
<body>
    <div class="monitor-container">
        <div class="camera-info">
            <span id="cameraName">{{ camera_name }}</span>
        </div>
        
        <div class="detection-container">
            <div class="detection-header">
                <h3>火灾检测结果</h3>
                <div id="detectionStatus" class="detection-status">检测中...</div>
            </div>
            <div class="detection-image-container">
                <img id="detectionFrame" alt="检测结果" />
            </div>
            <div class="detection-info">
                <div class="info-item">
                    <span class="info-label">检测状态:</span>
                    <span id="fireStatus" class="info-value">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">置信度:</span>
                    <span id="confidence" class="info-value">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">最后检测时间:</span>
                    <span id="lastDetectionTime" class="info-value">--</span>
                </div>
            </div>
        </div>
        
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p>正在连接摄像头...</p>
        </div>
        
        <div id="errorOverlay" class="error-overlay hidden">
            <div class="error-content">
                <h2>连接错误</h2>
                <p id="errorMessage">无法连接到摄像头</p>
                <button id="retryButton">重试</button>
            </div>
        </div>
        
        <div class="exit-container">
            <button id="exitButton" class="exit-button">退出监控</button>
        </div>
    </div>
    
    <script src="/static/js/monitor.js"></script>
</body>
</html>
